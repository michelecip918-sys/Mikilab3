        <script>
        (function(){
          function inField(el){ return el && el.closest && el.closest('input,textarea,[contenteditable="true"]'); }
          document.addEventListener('contextmenu', function(e){ if(!inField(e.target)) e.preventDefault(); }, {capture:true});
          document.addEventListener('copy', function(e){ if(!inField(e.target)) e.preventDefault(); }, {capture:true});
          document.addEventListener('cut', function(e){ if(!inField(e.target)) e.preventDefault(); }, {capture:true});
          document.addEventListener('dragstart', function(e){ if(e.target && e.target.tagName==='IMG') e.preventDefault(); }, {capture:true});
          document.addEventListener('keydown', function(e){
            var k=(e.key||'').toLowerCase();
            if(e.keyCode===123){ e.preventDefault(); return; } // F12
            if((e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c'].indexOf(k)>-1){ e.preventDefault(); return; }
            if((e.ctrlKey||e.metaKey)&&k==='u'){ e.preventDefault(); }
          }, {capture:true});
        })();
        </script>

        <script>
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", function () {
                    // Auto-update: se arriva un nuovo service worker, ricarica UNA volta per servire l'ultima build.
                    var refreshing = false;
                    navigator.serviceWorker.addEventListener("controllerchange", function () {
                        if (refreshing) return;
                        refreshing = true;
                        window.location.reload();
                    });
                    navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" }).then(function (reg) {
                        try { reg.update(); } catch (e) { /* */ }
                        reg.addEventListener("updatefound", function () {
                            var nw = reg.installing;
                            if (!nw) return;
                            nw.addEventListener("statechange", function () {
                                if (nw.state === "installed" && navigator.serviceWorker.controller) {
                                    // nuova versione pronta: il controllerchange qui sopra farà il reload
                                    try { nw.postMessage && nw.postMessage("skipWaiting"); } catch (e) { /* */ }
                                }
                            });
                        });
                    }).catch(function () {});
                });
            }
        </script>
